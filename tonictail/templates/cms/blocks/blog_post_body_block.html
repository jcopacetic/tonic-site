{% load wagtailimages_tags wagtailcore_tags %}
{# Block template: tonic-blog-post-body → blog_post_body_block.html #}
<!--
  Module: Tonic Blog Post Body (Global)
  Description: Wraps HubSpot's native blog_content tag with Tonic typography styles.
               Controls body text color, heading color, link color, blockquote style,
               and container width for optimal reading line length.
               Content is sourced entirely from HubSpot's blog content editor.
               — Author: Jonathan Sumner | jonathan@khaoticdigital.com
  Usage: Place once in the blog post template. Global — edit once, updates all posts.
-->

<div
  id="{{ name }}"
  class="tonic-post-body {{ value.advanced.custom_class }} hide-on-mobile"
>
  <div class="tonic-post-body__inner">
    <div class="tonic-post-body__content" id="tonic-post-content">
        {{ content.post_body }}
    </div>
  </div>
</div>
